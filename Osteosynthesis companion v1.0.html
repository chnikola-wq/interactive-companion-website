        // Section 9: Decision Flowchart
        function DecisionFlowchart() {
            const [offset, setOffset] = useState('');
            const [gap, setGap] = useState('');
            const [goal, setGoal] = useState('');

            const recommendation = useMemo(() => {
                if (!offset || !gap || !goal) return null;
                
                if (offset === 'no' && goal === 'primary') {
                    return "Plate in contact + primary healing goal → Screw placement has minimal influence. Prioritise anatomic reduction and absolute stability.";
                }
                if (offset === 'no' && gap === 'small' && goal === 'secondary') {
                    return "Small gap + plate contact → Load-sharing expected. Longer working length reduces plate stress. Aim for 10–40% interfragmentary strain.";
                }
                if (offset === 'yes' || gap === 'large') {
                    return "Large gap or bone-plate offset → Load-bearing construct. Shorter working length reduces plate stress and fatigue risk. Consider far-cortical locking to increase IFM if needed.";
                }
                return "Configuration acceptable. Monitor healing progress.";
            }, [offset, gap, goal]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8 space-y-6">
                    <div className="border-l-4 border-violet-500 pl-4">
                        <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white mb-2">
                            <FlowchartIcon /> Interactive Decision Flowchart
                        </h2>
                        <p className="text-slate-600 dark:text-slate-300 text-sm">
                            Based on MacLeod 2018, Fig 8. Answer three questions to receive a configuration recommendation.
                        </p>
                    </div>

                    <div className="grid md:grid-cols-3 gap-4">
                        <div>
                            <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                1. Bone–plate offset present?
                            </label>
                            <select 
                                value={offset} 
                                onChange={(e) => setOffset(e.target.value)}
                                className="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-600 font-bold"
                            >
                                <option value="">-- Select --</option>
                                <option value="yes">Yes</option>
                                <option value="no">No</option>
                            </select>
                        </div>

                        <div>
                            <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                2. Fracture gap size:
                            </label>
                            <select 
                                value={gap} 
                                onChange={(e) => setGap(e.target.value)}
                                className="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-600 font-bold"
                            >
                                <option value="">-- Select --</option>
                                <option value="small">&lt; 1 mm (small)</option>
                                <option value="large">&gt; 1 mm (large)</option>
                            </select>
                        </div>

                        <div>
                            <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                3. Healing goal:
                            </label>
                            <select 
                                value={goal} 
                                onChange={(e) => setGoal(e.target.value)}
                                className="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-600 font-bold"
                            >
                                <option value="">-- Select --</option>
                                <option value="primary">Primary (absolute stability)</option>
                                <option value="secondary">Secondary (callus formation)</option>
                            </select>
                        </div>
                    </div>

                    {recommendation && (
                        <div className="bg-emerald-50 dark:bg-emerald-900/20 p-6 rounded-lg border-2 border-emerald-500 shadow-lg">
                            <p className="text-lg font-bold text-emerald-700 dark:text-emerald-300 mb-2">Recommendation:</p>
                            <p className="text-slate-700 dark:text-slate-300">{recommendation}</p>
                        </div>
                    )}

                    {/* Flowchart SVG (simplified) */}
                    <div className="mt-6">
                        <p className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3">Full decision tree (MacLeod 2018, Fig 8):</p>
                        <svg viewBox="0 0 600 400" className="w-full h-auto bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700">
                            {/* Start */}
                            <rect x="250" y="10" width="100" height="40" rx="5" className={`fill-blue-500 text-white`}/>
                            <text x="300" y="35" className="fill-white text-sm font-bold" textAnchor="middle">Start</text>
                            
                            {/* Offset? */}
                            <line x1="300" y1="50" x2="300" y2="80" className={`stroke-slate-400 ${offset ? 'stroke-blue-600' : ''}`} strokeWidth="2"/>
                            <rect x="225" y="80" width="150" height="50" rx="5" className={`fill-slate-200 dark:fill-slate-700 ${offset ? 'stroke-blue-600 stroke-4' : 'stroke-slate-400 stroke-2'}`}/>
                            <text x="300" y="100" className="fill-slate-700 dark:fill-slate-300 text-xs font-bold" textAnchor="middle">Bone-plate</text>
                            <text x="300" y="115" className="fill-slate-700 dark:fill-slate-300 text-xs font-bold" textAnchor="middle">offset?</text>
                            
                            {/* Branches */}
                            <line x1="225" y1="130" x2="100" y2="180" className={`stroke-slate-400 ${offset === 'no' ? 'stroke-blue-600 stroke-3' : ''}`} strokeWidth="2"/>
                            <text x="150" y="155" className="fill-slate-600 dark:fill-slate-400 text-xs font-bold">No</text>
                            
                            <line x1="375" y1="130" x2="500" y2="180" className={`stroke-slate-400 ${offset === 'yes' ? 'stroke-blue-600 stroke-3' : ''}`} strokeWidth="2"/>
                            <text x="450" y="155" className="fill-slate-600 dark:fill-slate-400 text-xs font-bold">Yes</text>
                            
                            {/* Gap? */}
                            <rect x="25" y="180" width="150" height="50" rx="5" className={`fill-slate-200 dark:fill-slate-700 ${offset === 'no' && gap ? 'stroke-blue-600 stroke-4' : 'stroke-slate-400 stroke-2'}`}/>
                            <text x="100" y="200" className="fill-slate-700 dark:fill-slate-300 text-xs font-bold" textAnchor="middle">Gap &gt; 1mm?</text>
                            
                            {/* Outcomes */}
                            <rect x="25" y="270" width="70" height="60" rx="5" className={`fill-green-100 dark:fill-green-900/30 ${offset === 'no' && gap === 'small' ? 'stroke-green-600 stroke-4' : 'stroke-green-400 stroke-2'}`}/>
                            <text x="60" y="295" className="fill-green-700 dark:fill-green-400 text-xs font-bold" textAnchor="middle">Load-</text>
                            <text x="60" y="310" className="fill-green-700 dark:fill-green-400 text-xs font-bold" textAnchor="middle">sharing</text>
                            
                            <rect x="105" y="270" width="70" height="60" rx="5" className={`fill-red-100 dark:fill-red-900/30 ${offset === 'no' && gap === 'large' ? 'stroke-red-600 stroke-4' : 'stroke-red-400 stroke-2'}`}/>
                            <text x="140" y="295" className="fill-red-700 dark:fill-red-400 text-xs font-bold" textAnchor="middle">Load-</text>
                            <text x="140" y="310" className="fill-red-700 dark:fill-red-400 text-xs font-bold" textAnchor="middle">bearing</text>
                            
                            <rect x="425" y="270" width="150" height="60" rx="5" className={`fill-red-100 dark:fill-red-900/30 ${offset === 'yes' ? 'stroke-red-600 stroke-4' : 'stroke-red-400 stroke-2'}`}/>
                            <text x="500" y="295" className="fill-red-700 dark:fill-red-400 text-xs font-bold" textAnchor="middle">Load-bearing</text>
                            <text x="500" y="310" className="fill-red-700 dark:fill-red-400 text-xs font-bold" textAnchor="middle">(use shorter WL)</text>
                        </svg>
                    </div>

                    <p className="text-xs text-slate-500 dark:text-slate-400 italic border-t border-slate-200 dark:border-slate-700 pt-4">
                        <strong>Source:</strong> MacLeod & Pankaj (2018), Injury 49S1:S12–S18, Fig 8
                    </p>
                </div>
            );
        }

        // Section 10: Summary & Cross-Links
        function SummarySection() {
            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8 space-y-6">
                    <div className="border-l-4 border-slate-500 pl-4">
                        <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white mb-2">
                            <BookIcon /> Summary & Clinical Take-Homes
                        </h2>
                        <p className="text-slate-600 dark:text-slate-300 text-sm">
                            Key insights synthesised from Chao 2013, MacLeod 2018, and MacLeod 2015.
                        </p>
                    </div>

                    <div className="space-y-4">
                        <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-lg border border-blue-200 dark:border-blue-800/50">
                            <h3 className="font-bold text-blue-800 dark:text-blue-400 mb-2">1. The Working Length Paradox is Real</h3>
                            <p className="text-sm text-slate-700 dark:text-slate-300">
                                Longer working length reduces plate stress in <strong>load-sharing</strong> scenarios (small gaps, plate-bone contact) but 
                                <em>increases</em> plate stress in <strong>load-bearing</strong> scenarios (large gaps, comminution). The same screw configuration performs 
                                differently depending on the fracture pattern.
                            </p>
                        </div>

                        <div className="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-lg border border-emerald-200 dark:border-emerald-800/50">
                            <h3 className="font-bold text-emerald-800 dark:text-emerald-400 mb-2">2. Interfragmentary Strain is the Master Variable</h3>
                            <p className="text-sm text-slate-700 dark:text-slate-300">
                                Secondary healing requires 10–40% interfragmentary strain. Too little (&lt;2%) promotes primary healing (slow, requires absolute stability). 
                                Too much (&gt;40%) disrupts callus formation and leads to non-union. The construct stiffness must be tuned to the fracture gap.
                            </p>
                        </div>

                        <div className="bg-purple-50 dark:bg-purple-900/20 p-4 rounded-lg border border-purple-200 dark:border-purple-800/50">
                            <h3 className="font-bold text-purple-800 dark:text-purple-400 mb-2">3. Locking Plates Excel in Osteoporotic Bone</h3>
                            <p className="text-sm text-slate-700 dark:text-slate-300">
                                DCP screws induce preload strain all around the screw hole (from tightening and plate tensioning), creating large tensile strains 
                                that weaken osteoporotic bone. LCP screws confine strain to the loaded side, reducing tensile strain volume by up to 53% in gap scenarios.
                            </p>
                        </div>

                        <div className="bg-amber-50 dark:bg-amber-900/20 p-4 rounded-lg border border-amber-200 dark:border-amber-800/50">
                            <h3 className="font-bold text-amber-800 dark:text-amber-500 mb-2">4. Bone-Plate Offset Introduces Asymmetric Closure</h3>
                            <p className="text-sm text-slate-700 dark:text-slate-300">
                                When the plate is offset from the bone, the near cortex closes more than the far cortex, creating uneven IFM distribution. 
                                Techniques like far-cortical locking increase IFM but also increase screw-bone interface strain via the lever-arm effect.
                            </p>
                        </div>

                        <div className="bg-teal-50 dark:bg-teal-900/20 p-4 rounded-lg border border-teal-200 dark:border-teal-800/50">
                            <h3 className="font-bold text-teal-800 dark:text-teal-400 mb-2">5. Material Choice: Ti vs SS is a Trade-Off</h3>
                            <p className="text-sm text-slate-700 dark:text-slate-300">
                                Titanium (E ≈ 110 GPa) increases IFM compared to stainless steel (E ≈ 200 GPa), but the increase is <em>not</em> proportional 
                                to the modulus ratio because the plate is eccentric to the load. Higher-stiffness plates reduce screw-bone interface strain concentrations.
                            </p>
                        </div>

                        <div className="bg-rose-50 dark:bg-rose-900/20 p-4 rounded-lg border border-rose-200 dark:border-rose-800/50">
                            <h3 className="font-bold text-rose-800 dark:text-rose-400 mb-2">6. Load Direction Dictates Construct Behavior</h3>
                            <p className="text-sm text-slate-700 dark:text-slate-300">
                                Tension-band loading (toward the plate) allows load-sharing and is safe for early weight-bearing. Gap-opening loading (away from the plate) 
                                forces the plate to bear the full load, risking fatigue failure. Chao 2013 demonstrated that offset axial loads can cause plate lift-off in long WL constructs.
                            </p>
                        </div>

                        <div className="bg-green-50 dark:bg-green-900/20 p-4 rounded-lg border border-green-200 dark:border-green-800/50">
                            <h3 className="font-bold text-green-800 dark:text-green-400 mb-2">7. Callus Stiffening Shifts the Load Progressively</h3>
                            <p className="text-sm text-slate-700 dark:text-slate-300">
                                As callus forms over 12–24 weeks, its stiffness increases exponentially. Flexible plates (longer WL) initially see higher stress 
                                but transition to load-sharing more effectively as healing progresses, ultimately reducing plate stress faster than rigid constructs.
                            </p>
                        </div>
                    </div>

                    {/* Link back to v3.8 */}
                    <div className="bg-gradient-to-r from-blue-500 to-indigo-600 p-6 rounded-xl shadow-lg text-white mt-8">
                        <h3 className="text-xl font-extrabold mb-3">Ready for Quantitative Analysis?</h3>
                        <p className="text-sm mb-4 opacity-90">
                            This companion has introduced you to the <em>concepts</em>. Now move to the full calculator to model specific implant geometries, 
                            calculate stiffness, evaluate yield strength, and estimate fatigue life for your patient's case.
                        </p>
                        <a 
                            href="Osteosynthesis stiffness v3.8.html"
                            className="inline-block px-6 py-3 bg-white text-blue-600 font-bold rounded-lg shadow-md hover:bg-blue-50 transition-all"
                        >
                            Open the v3.8 Stiffness & Strength Calculator →
                        </a>
                    </div>

                    <div className="border-t-2 border-slate-200 dark:border-slate-700 pt-6 space-y-3 text-sm text-slate-600 dark:text-slate-400">
                        <p className="font-bold text-slate-800 dark:text-slate-200">References:</p>
                        <ul className="list-disc pl-5 space-y-1">
                            <li>Chao P, Conrad BP, Lewis DD, Horodyski MB, Pozzi A. (2013). Effect of plate working length on plate stiffness and cyclic fatigue life in a cadaveric femoral fracture gap model stabilized with a 12-hole 2.4 mm locking compression plate. <em>BMC Vet Res</em> 9:125.</li>
                            <li>MacLeod AR, Pankaj P. (2018). Pre-operative planning for fracture fixation using locking plates: device configuration and other considerations. <em>Injury</em> 49(S1):S12–S18.</li>
                            <li>MacLeod AR, Simpson AHRW, Pankaj P. (2015). Reasons why dynamic compression plates are inferior to locking plates in osteoporotic bone: a finite element explanation. <em>Comput Methods Biomech Biomed Eng</em> 18:16, 1818–1825.</li>
                        </ul>
                    </div>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
